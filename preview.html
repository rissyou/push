<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할 일 목록</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --bg: #f3f4f8;
      --card: #ffffff;
      --text: #1a1d24;
      --muted: #7a8190;
      --line: #eceef3;
      --accent: #5b5bf0;
      --accent-2: #8b5cf6;
      --accent-soft: #ecebfe;
      --ok: #16a34a;
      --ok-soft: #e3f6ea;
      --warn: #d97706;
      --warn-soft: #fdf1dc;
      --danger: #dc2626;
      --danger-soft: #fde4e4;
      --shadow: 0 1px 2px rgba(20, 24, 40, .04), 0 4px 16px rgba(20, 24, 40, .06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1116;
        --card: #191c24;
        --text: #e8eaf0;
        --muted: #8d94a3;
        --line: #262a35;
        --accent: #8b8bff;
        --accent-2: #a78bfa;
        --accent-soft: #23234a;
        --ok: #4ade80;
        --ok-soft: #173123;
        --warn: #fbbf24;
        --warn-soft: #3a2c10;
        --danger: #f87171;
        --danger-soft: #3d1a1a;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Pretendard, system-ui, -apple-system, "Malgun Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 600px; margin: 0 auto; padding: 40px 16px 64px; }

    .back {
      display: inline-block;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: .9rem;
      font-weight: 600;
      text-decoration: none;
    }
    .back:hover { color: var(--text); }

    /* 헤더 카드 */
    .hero {
      position: relative;
      overflow: hidden;
      padding: 28px 24px 24px;
      border-radius: 20px;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 10px 30px rgba(91, 91, 240, .25);
    }
    .hero::after {
      content: "";
      position: absolute;
      right: -40px; top: -40px;
      width: 160px; height: 160px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .12);
    }
    .hero .date { font-size: .85rem; opacity: .85; margin: 0 0 6px; }
    .hero h1 { font-size: 1.7rem; font-weight: 800; margin: 0 0 18px; letter-spacing: -.02em; }
    .progress-row { display: flex; justify-content: space-between; font-size: .9rem; margin-bottom: 8px; }
    .progress-row strong { font-weight: 700; }
    .bar { height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .25); overflow: hidden; }
    .bar > span { display: block; height: 100%; width: 0; border-radius: inherit; background: #fff; transition: width .6s ease; }

    /* 필터 탭 */
    .tabs { display: flex; gap: 8px; margin: 24px 0 14px; }
    .tab {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--muted);
      font: inherit;
      font-size: .9rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 99px;
      cursor: pointer;
      transition: all .15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { background: var(--text); border-color: var(--text); color: var(--bg); }
    .tab .count { opacity: .6; margin-left: 4px; font-weight: 500; }

    /* 목록 */
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    .item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      transition: transform .15s, box-shadow .15s;
      animation: rise .35s ease both;
    }
    .item:hover { transform: translateY(-2px); }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } }

    .check {
      flex: none;
      width: 26px; height: 26px;
      border-radius: 50%;
      border: 2px solid var(--line);
      display: grid; place-items: center;
      color: #fff;
    }
    .check svg { width: 14px; height: 14px; opacity: 0; }
    .done .check { background: var(--ok); border-color: var(--ok); }
    .done .check svg { opacity: 1; }

    .body { flex: 1; min-width: 0; }
    .title { font-weight: 600; font-size: 1.02rem; margin-bottom: 6px; overflow-wrap: anywhere; }
    .done .title { color: var(--muted); text-decoration: line-through; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      font-size: .78rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 99px;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .chip.muted { background: var(--bg); color: var(--muted); font-weight: 500; }

    .dday {
      flex: none;
      font-size: .82rem;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 10px;
      background: var(--warn-soft);
      color: var(--warn);
    }
    .dday.urgent { background: var(--danger-soft); color: var(--danger); }
    .dday.ok { background: var(--ok-soft); color: var(--ok); }

    /* 상태 메시지 */
    .state {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
      background: var(--card);
      border: 1px dashed var(--line);
      border-radius: 16px;
    }
    .state .emoji { font-size: 2rem; display: block; margin-bottom: 8px; }
    .state.error { color: var(--danger); }
    .skeleton {
      height: 74px;
      border-radius: 16px;
      background: linear-gradient(90deg, var(--card) 25%, var(--line) 50%, var(--card) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }
  </style>
</head>
<body>
  <main>
    <a class="back" href="index.html">‹ 홈으로</a>
    <section class="hero">
      <p class="date" id="today"></p>
      <h1>할 일 목록</h1>
      <div class="progress-row">
        <span>진행률</span>
        <strong id="progressText">–</strong>
      </div>
      <div class="bar"><span id="progressBar"></span></div>
    </section>

    <nav class="tabs" id="tabs">
      <button class="tab active" data-filter="all">전체<span class="count" id="c-all"></span></button>
      <button class="tab" data-filter="todo">진행 중<span class="count" id="c-todo"></span></button>
      <button class="tab" data-filter="done">완료<span class="count" id="c-done"></span></button>
    </nav>

    <ul id="list">
      <li class="skeleton"></li>
      <li class="skeleton"></li>
      <li class="skeleton"></li>
    </ul>
  </main>

  <script>
    const SUPABASE_URL = 'https://canargjsxnfrcqkwghgz.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_oBjgOw8YazifEcWC4hhqEg_9VJYr_0v';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const listEl = document.getElementById('list');
    const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

    let todos = [];
    let filter = 'all';

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    document.getElementById('today').textContent =
      today.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function dday(dateStr) {
      if (!dateStr) return null;
      const diff = Math.round((new Date(dateStr + 'T00:00:00') - today) / 86400000);
      if (diff === 0) return { label: 'D-DAY', cls: 'urgent' };
      if (diff < 0) return { label: `D+${-diff}`, cls: 'urgent' };
      return { label: `D-${diff}`, cls: diff <= 3 ? 'urgent' : '' };
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });
    }

    function render() {
      const doneCount = todos.filter(t => t.done).length;
      const pct = todos.length ? Math.round(doneCount / todos.length * 100) : 0;
      document.getElementById('progressText').textContent = `${doneCount} / ${todos.length} 완료 · ${pct}%`;
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('c-all').textContent = todos.length;
      document.getElementById('c-todo').textContent = todos.length - doneCount;
      document.getElementById('c-done').textContent = doneCount;

      const shown = todos.filter(t =>
        filter === 'all' ? true : filter === 'done' ? t.done : !t.done);

      if (!shown.length) {
        const msg = filter === 'done' ? '아직 완료한 일이 없어요' : filter === 'todo' ? '모두 끝냈어요!' : '할 일이 없어요';
        listEl.innerHTML = `<li class="state"><span class="emoji">${filter === 'todo' ? '🎉' : '📭'}</span>${msg}</li>`;
        return;
      }

      listEl.innerHTML = shown.map((t, i) => {
        const d = t.done ? { label: '완료', cls: 'ok' } : dday(t.due_date);
        return `
          <li class="item ${t.done ? 'done' : ''}" style="animation-delay:${i * 50}ms">
            <span class="check">${CHECK_SVG}</span>
            <div class="body">
              <div class="title">${escapeHtml(t.title)}</div>
              <div class="chips">
                ${t.amount != null ? `<span class="chip">수량 ${escapeHtml(t.amount)}</span>` : ''}
                ${t.due_date ? `<span class="chip muted">📅 ${escapeHtml(formatDate(t.due_date))}</span>` : ''}
              </div>
            </div>
            ${d ? `<span class="dday ${d.cls}">${d.label}</span>` : ''}
          </li>`;
      }).join('');
    }

    document.getElementById('tabs').addEventListener('click', e => {
      const btn = e.target.closest('.tab');
      if (!btn) return;
      document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === btn));
      filter = btn.dataset.filter;
      render();
    });

    async function loadTodos() {
      const { data, error } = await client
        .from('test_todos')
        .select('*')
        .order('due_date', { ascending: true });

      if (error) {
        document.getElementById('progressText').textContent = '–';
        listEl.innerHTML = `<li class="state error"><span class="emoji">⚠️</span>불러오기 실패: ${escapeHtml(error.message)}</li>`;
        return;
      }
      todos = data;
      render();
    }

    loadTodos();
  </script>
</body>
</html>
