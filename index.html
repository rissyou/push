<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Push 홈</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --bg: #f3f4f8;
      --card: #ffffff;
      --text: #1a1d24;
      --muted: #7a8190;
      --line: #eceef3;
      --accent: #5b5bf0;
      --accent-2: #8b5cf6;
      --accent-soft: #ecebfe;
      --shadow: 0 1px 2px rgba(20, 24, 40, .04), 0 4px 16px rgba(20, 24, 40, .06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1116;
        --card: #191c24;
        --text: #e8eaf0;
        --muted: #8d94a3;
        --line: #262a35;
        --accent: #8b8bff;
        --accent-2: #a78bfa;
        --accent-soft: #23234a;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Pretendard, system-ui, -apple-system, "Malgun Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 600px; margin: 0 auto; padding: 40px 16px 64px; }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 32px 24px;
      border-radius: 20px;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 10px 30px rgba(91, 91, 240, .25);
    }
    .hero::after {
      content: "";
      position: absolute;
      right: -40px; top: -40px;
      width: 160px; height: 160px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .12);
    }
    .hero p { margin: 0 0 6px; font-size: .9rem; opacity: .85; }
    .hero h1 { margin: 0; font-size: 1.9rem; font-weight: 800; letter-spacing: -.02em; }

    h2 { font-size: .9rem; color: var(--muted); font-weight: 600; margin: 28px 0 12px; }

    .menu { display: grid; gap: 10px; }
    .card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      color: inherit;
      text-decoration: none;
      transition: transform .15s;
    }
    .card:hover { transform: translateY(-2px); }
    .icon {
      flex: none;
      width: 44px; height: 44px;
      border-radius: 12px;
      display: grid; place-items: center;
      font-size: 1.3rem;
      background: var(--accent-soft);
    }
    .card .body { flex: 1; }
    .card strong { display: block; font-size: 1.05rem; margin-bottom: 3px; }
    .card span { color: var(--muted); font-size: .88rem; }
    .arrow { color: var(--muted); font-size: 1.2rem; }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <p>Supabase 연결 프로젝트</p>
      <h1>Push</h1>
    </section>

    <h2>페이지</h2>
    <nav class="menu">
      <a class="card" href="preview.html">
        <span class="icon">✅</span>
        <div class="body">
          <strong>할 일 목록</strong>
          <span>test_todos 표의 데이터를 불러와 보여줘요</span>
        </div>
        <span class="arrow">›</span>
      </a>
    </nav>
  </main>
</body>
</html>
